[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests/api"]
markers = ["integration: requires the configured Supabase database", "concurrency: real concurrent PostgreSQL transactions"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
