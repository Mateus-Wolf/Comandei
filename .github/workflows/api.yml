name: API
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: comandei_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_ALLOW_LOCAL_PLAINTEXT: '1'
      RUN_DB_TESTS: '1'
      SUPABASE_DB_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/comandei_test
      PYTHONPATH: apps/api
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r apps/api/requirements-dev.lock.txt
      - run: python scripts/prepare-test-db.py
      - run: ruff check apps/api/comandei tests/api
      - run: pytest --cov=comandei --cov-report=term-missing
      - run: pytest tests/api/test_domain.py tests/api/test_auth.py --cov=comandei.domain --cov=comandei.core.auth --cov=comandei.core.permissions --cov-fail-under=85
      - run: npm ci
      - run: npm run db:replay
      - run: npm run typecheck
      - run: npm run api:contract
      - run: git diff --exit-code -- packages/api-client
